version: '3.8'

services:
  # PostgreSQL com extensão PostGIS para geolocalização
  postgres:
    image: postgis/postgis:15-3.3
    container_name: monitora-to-db
    environment:
      POSTGRES_USER: ${DB_USER:-monitora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitora123}
      POSTGRES_DB: ${DB_NAME:-monitora_to}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitora-network

  # Redis para cache
  redis:
    image: redis:7-alpine
    container_name: monitora-to-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitora-network

  # API Backend Node.js/NestJS
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitora-to-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-monitora}:${DB_PASSWORD:-monitora123}@postgres:5432/${DB_NAME:-monitora_to}
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - monitora-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  monitora-network:
    driver: bridge
